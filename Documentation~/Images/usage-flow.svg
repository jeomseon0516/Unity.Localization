<svg xmlns="http://www.w3.org/2000/svg" width="980" height="410" viewBox="0 0 980 410" role="img" aria-labelledby="title desc">
<title id="title">Reference editing and localized lookup</title><desc id="desc">Data and references remain Unity Localization objects. Verify Inspector assignment and locale-specific lookup independently. Missing references or locales return empty text. No cancellation-token overload is supplied.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#2563eb"/></marker></defs>
<rect width="980" height="410" rx="16" fill="#f1f5f9"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#0f172a"><text x="24" y="43" font-size="24" font-weight="700">Reference editing and localized lookup</text>
<text x="24" y="69" font-size="13" fill="#475569">PRIMARY FLOW</text><g><rect x="24" y="88" width="288" height="96" rx="12" fill="#ffffff" stroke="#64748b"/><text x="40" y="124" font-size="17" font-weight="600">Locale / String Table</text><text x="40" y="153" font-size="14" fill="#475569">Unity Localization data</text></g><g><rect x="338" y="88" width="288" height="96" rx="12" fill="#ffffff" stroke="#64748b"/><text x="354" y="124" font-size="17" font-weight="600">Attributed LocalizedString</text><text x="354" y="153" font-size="14" fill="#475569">Select Table and Entry</text></g><g><rect x="652" y="88" width="288" height="96" rx="12" fill="#ffffff" stroke="#64748b"/><text x="668" y="124" font-size="17" font-weight="600">Async locale lookup</text><text x="668" y="153" font-size="14" fill="#475569">Await initialization</text></g><path d="M312 136 h22" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><path d="M626 136 h22" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="24" y="222" font-size="13" fill="#475569">OUTCOMES AND LIFETIME RULES</text><g><rect x="24" y="240" width="288" height="96" rx="12" fill="#ffffff" stroke="#64748b"/><text x="40" y="276" font-size="17" font-weight="600">StringDatabase</text><text x="40" y="305" font-size="14" fill="#475569">Resolve requested locale</text></g><g><rect x="338" y="240" width="288" height="96" rx="12" fill="#ffffff" stroke="#64748b"/><text x="354" y="276" font-size="17" font-weight="600">Localized text</text><text x="354" y="305" font-size="14" fill="#475569">Use result / handle empty</text></g><g><rect x="652" y="240" width="288" height="96" rx="12" fill="#ffffff" stroke="#64748b"/><text x="668" y="276" font-size="17" font-weight="600">StringChanged listener</text><text x="668" y="305" font-size="14" fill="#475569">Subscribe / unsubscribe</text></g>
<text x="24" y="380" font-size="14">Missing references or locales return empty text. No cancellation-token overload is supplied.</text></g></svg>